name: Recommended products (every 4 hours)

on:
  # כל 4 שעות: פונה לפיילייט API של אליאקספרס, לוקח 3 זוויות חיפוש,
  # שומר מוצרים ל-Firestore (האתר) ומפרסם לטלגרם.
  # כל שעה גמר את מכסת הכתיבות היומית של Firebase (Spark) — פעם ב-4 שעות
  # מוריד את הכתיבות לרבע.
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recommended-products
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Run recommended products job
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          PREFERRED_SHOP_IDS: ${{ secrets.PREFERRED_SHOP_IDS }}
          SITE_URL: ${{ secrets.SITE_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SKIP_FACEBOOK: ${{ secrets.SKIP_FACEBOOK }}
          SOCIAL_TELEGRAM: ${{ secrets.SOCIAL_TELEGRAM }}
          SOCIAL_INSTAGRAM: ${{ secrets.SOCIAL_INSTAGRAM }}
          SOCIAL_FACEBOOK: ${{ secrets.SOCIAL_FACEBOOK }}
          SOCIAL_YOUTUBE: ${{ secrets.SOCIAL_YOUTUBE }}
        run: node run-once.js

      # מוצר שהמוכר הסיר מאליאקספרס: מסתירים באתר, מחליפים במוצר דומה,
      # ומעדכנים את הלינק בסרטוני יוטיוב שמפנים אליו.
      - name: Hide products that are no longer on AliExpress
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node run-availability.js
