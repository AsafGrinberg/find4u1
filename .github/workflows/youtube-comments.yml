name: YouTube comment replies

# כל חצי שעה: עובר על התגובות בסרטונים האחרונים של הערוץ ועונה לכל תגובה
# ראשית עם הלינק למוצר שמופיע בסרטון. תגובה שענינו עליה נרשמת ב-Firestore
# (answeredComments) ולכן לא נשלחת פעמיים.
#
# סודות נדרשים:
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
#     (הטוקן חייב לכלול youtube.force-ssl — מריצים שוב node scripts/auth-token.js youtube)
#   FIREBASE_SERVICE_ACCOUNT  (כמו בג'וב ההורלי)
# אופציונלי:
#   SITE_URL                 (ברירת מחדל https://find4u.vercel.app)
#   REPLY_MAX_PER_RUN        (ברירת מחדל 30 תגובות לריצה)
#   REPLY_MAX_AGE_DAYS       (ברירת מחדל 30 — לא עונים לתגובות ישנות)
#   REPLY_VIDEOS             (ברירת מחדל 25 — כמה סרטונים אחרונים לסרוק)

on:
  schedule:
    - cron: "*/30 * * * *"
  # הרצה ידנית: Actions → YouTube comment replies → Run workflow.
  # dry_run=true מדפיס מה היה נשלח בלי לשלוח כלום — לבדיקה ראשונה.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "רק להדפיס מה היה נשלח (לא שולח תגובות)"
        type: boolean
        default: false
      max_replies:
        description: "מקסימום תגובות לריצה (ריק = 30)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: youtube-comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Reply to new comments
        working-directory: video
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          REPLY_MAX_PER_RUN: ${{ github.event.inputs.max_replies || secrets.REPLY_MAX_PER_RUN }}
          REPLY_MAX_AGE_DAYS: ${{ secrets.REPLY_MAX_AGE_DAYS }}
          REPLY_VIDEOS: ${{ secrets.REPLY_VIDEOS }}
        run: node scripts/reply-comments.js
