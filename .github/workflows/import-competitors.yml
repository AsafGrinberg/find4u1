name: Import competitor products

# פעמיים ביום: קורא פוסטים מערוצי מתחרים ציבוריים (t.me/s/<channel>) ומהתיבה
# הידנית imports/inbox.txt, מוציא מהם את מזהה המוצר באליאקספרס, מייצר קישור
# שותפים משלנו, שומר את המוצר בקטלוג ומפרסם לערוץ שלנו עם כיתוב חדש משלנו.
#
# "מוצר כן, תוכן לא": לא מעתיקים טקסט/תמונות/קישור שלהם — רק את המוצר.
# מוצר שנכנס עם סרטון של המוכר ייכנס אוטומטית לתור של weekly-reel,
# ושם ה-AI מייצר ממנו ריל חדש עם קריינות עברית ועריכה שלנו.
#
# סודות נדרשים:
#   FIREBASE_SERVICE_ACCOUNT
#   ALIEXPRESS_APP_KEY / ALIEXPRESS_APP_SECRET / ALIEXPRESS_TRACKING_ID
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL
# אופציונלי:
#   COMPETITOR_CHANNELS  ערוצים ציבוריים מופרדים בפסיק, למשל: shodedim,deals_channel
#   IMPORT_LIMIT         ברירת מחדל 2 מוצרים לריצה
#   IMPORT_DRY_RUN=1     מציג מה היה נכנס בלי לשמור ולפרסם

on:
  schedule:
    # 09:00 / 18:00 UTC = 11:00 / 20:00 בישראל בחורף
    - cron: "0 9,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-competitors
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Import products from competitor channels
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          COMPETITOR_CHANNELS: ${{ secrets.COMPETITOR_CHANNELS }}
          IMPORT_LIMIT: ${{ secrets.IMPORT_LIMIT }}
          IMPORT_DRY_RUN: ${{ secrets.IMPORT_DRY_RUN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node run-import.js
