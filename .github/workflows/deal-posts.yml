name: Telegram deal posts

# שלושה פוסטי דילים ביום לערוץ הטלגרם, מתוך הקטלוג שלנו.
# דיל = מוצר אמיתי שהמחיר שלו באמת ירד (price מול originalPrice), עם
# קישור הרכישה שלנו וכפתורים: רכישה, דף המוצר, שיתוף בטלגרם/וואטסאפ.
# אין כאן קופונים מומצאים: קופון רשמי של אליאקספרס מוצג רק אם מדביקים
# אותו בסוד DEAL_COUPON_TEXT.
#
# סודות חובה (כבר קיימים):
#   FIREBASE_SERVICE_ACCOUNT, TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL
#
# סודות רשות — לא חייבים להוסיף אף אחד מהם. אם לא הוספת, ברירת המחדל
# שבקובץ functions/deals.js נכנסת לפעולה:
#   DEAL_COUPON_TEXT     טקסט קופון רשמי (קוד + תנאי + תוקף), שורות עם \n
#   DEALS_PER_RUN        כמה פוסטים לריצה (ברירת מחדל 2)
#   DEAL_MIN_DISCOUNT    אחוז הנחה מינימלי כדי שהמוצר ייחשב דיל (25)
#   DEAL_MAX_PRICE       מחיר מקסימלי בשקלים (250)
#   DEAL_REPEAT_DAYS     כמה ימים מוצר שפורסם לא חוזר (4)
#   DEALS_DRY_RUN=1      מדפיס מה היה נשלח, בלי לשלוח כלום

on:
  schedule:
    # 08:00 / 13:00 / 18:00 UTC = 10:00 / 15:00 / 20:00 בישראל בחורף
    - cron: "0 8,13,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deal-posts
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Post deals to Telegram
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DEAL_COUPON_TEXT: ${{ secrets.DEAL_COUPON_TEXT }}
          DEALS_PER_RUN: ${{ secrets.DEALS_PER_RUN }}
          DEAL_MIN_DISCOUNT: ${{ secrets.DEAL_MIN_DISCOUNT }}
          DEAL_MAX_PRICE: ${{ secrets.DEAL_MAX_PRICE }}
          DEAL_REPEAT_DAYS: ${{ secrets.DEAL_REPEAT_DAYS }}
          DEALS_DRY_RUN: ${{ secrets.DEALS_DRY_RUN }}
        run: node run-deals.js
