name: Daily product reel

# פעם ביום: מייצר ריל אנכי מהסרטון של המוצר הבא (לא מתמונות),
# עם קריינות עברית וכתוביות, ומפרסם לכל ערוץ שמוגדר בסודות:
# טלגרם, אינסטגרם, פייסבוק, יוטיוב וטיקטוק.
#
# סודות נדרשים (לפחות ערוץ אחד):
#   FIREBASE_SERVICE_ACCOUNT  (כמו בג'וב ההורלי)
#   GEMINI_API_KEY            (Gemini TTS — הקול העברי הטבעי, מפתח מ-AI Studio)
#   GOOGLE_TTS_API_KEY        (Cloud TTS / WaveNet — הגיבוי)
#   ELEVENLABS_API_KEY        (אופציונלי — קול ElevenLabs)
#
# ערוצי פרסום (כל אחד בלי תלות באחר):
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHANNEL
#   IG_USER_ID / IG_ACCESS_TOKEN
#   FB_PAGE_ID / FB_PAGE_ACCESS_TOKEN
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN
#   TIKTOK_ACCESS_TOKEN  (+ TIKTOK_MODE=inbox|direct, TIKTOK_PRIVACY)
#
# אופציונלי:
#   TTS_PROVIDER              (auto = Gemini קודם; gemini / google / elevenlabs)
#   GEMINI_TTS_VOICE          (ברירת מחדל Sadachbia; אנרגטיים: Fenrir, Zephyr, Puck, Aoede)
#   GEMINI_TTS_MODEL / GEMINI_TTS_FALLBACK_MODEL  (ברירת מחדל gemini-3.8-flash-tts,
#                              ואם נגמרה המכסה היומית — gemini-3.8-flash-lite-tts)
#   GEMINI_TTS_SPEED          (ברירת מחדל 1.12 — קצב ב-preservePitch)
#   GEMINI_TTS_PER_SENTENCE   (1 = בקשה לכל משפט; רק בחשבון בתשלום)
#   GOOGLE_TTS_VOICE          (ברירת מחדל he-IL-Wavenet-A)
#   TTS_SPEED                 (קצב דיבור לגוגל, ברירת מחדל 1 — 1 = בלי האצה)
#   ELEVENLABS_MODEL / ELEVENLABS_VOICE_ID  (קול עברי מ־Voice Library)
#   ELEVENLABS_STABILITY (0.3) / ELEVENLABS_STYLE (0.55) — כיוונון הבעתיות
#   ELEVENLABS_SIMILARITY (0.85) / ELEVENLABS_SPEED (1) / ELEVENLABS_FORMAT
#   REEL_MUSIC_FILE / REEL_MUSIC_VOLUME  (שכבת מוזיקה שקטה, ברירת מחדל 0.01)
#   YOUTUBE_PRIVACY           (public / unlisted / private)
#   SITE_URL

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: video
        run: npm install --no-audit --no-fund

      - name: Ensure Chromium for Remotion
        working-directory: video
        run: npx --no-install remotion browser ensure

      - name: Check the narration voice
        working-directory: video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ secrets.GOOGLE_TTS_VOICE }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
          ELEVENLABS_STABILITY: ${{ secrets.ELEVENLABS_STABILITY }}
          ELEVENLABS_STYLE: ${{ secrets.ELEVENLABS_STYLE }}
          ELEVENLABS_SIMILARITY: ${{ secrets.ELEVENLABS_SIMILARITY }}
        run: node scripts/check-voice.js

      - name: Render reel
        working-directory: video
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_VOICE: ${{ secrets.GEMINI_TTS_VOICE }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
          GEMINI_TTS_SPEED: ${{ secrets.GEMINI_TTS_SPEED }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GOOGLE_TTS_VOICE: ${{ secrets.GOOGLE_TTS_VOICE }}
          TTS_SPEED: ${{ secrets.TTS_SPEED }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ secrets.ELEVENLABS_MODEL }}
          ELEVENLABS_STABILITY: ${{ secrets.ELEVENLABS_STABILITY }}
          ELEVENLABS_STYLE: ${{ secrets.ELEVENLABS_STYLE }}
          ELEVENLABS_SIMILARITY: ${{ secrets.ELEVENLABS_SIMILARITY }}
          ELEVENLABS_SPEED: ${{ secrets.ELEVENLABS_SPEED }}
          ELEVENLABS_FORMAT: ${{ secrets.ELEVENLABS_FORMAT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/render.js

      - name: Commit the reel so it has a public URL
        run: |
          if [ ! -f video/out/reel.json ]; then
            echo "No reel was rendered."
            exit 0
          fi
          git config user.name "find4u-bot"
          git config user.email "bot@find4u.local"
          git add public/videos
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add weekly product reel"
            git push
          fi

      - name: Publish to every configured channel
        working-directory: video
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_MODE: ${{ secrets.TIKTOK_MODE }}
          TIKTOK_PRIVACY: ${{ secrets.TIKTOK_PRIVACY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node scripts/publish.js

      - name: Keep the rendered file as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            video/out/reel.mp4
            video/out/reel.json
          if-no-files-found: ignore
          retention-days: 14
